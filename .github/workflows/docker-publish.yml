name: Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package.json version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compute image names
        id: image
        run: |
          echo "ghcr=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "dockerhub=docker.io/$(echo 'thezucompany/rabbitlens' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: thezucompany
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether this version was already published
        id: check
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          EXISTS=true
          for IMAGE in "${{ steps.image.outputs.ghcr }}" "${{ steps.image.outputs.dockerhub }}"; do
            if ! docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
              echo "$IMAGE:$VERSION is missing"
              EXISTS=false
            fi
          done
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.ghcr }}:${{ steps.package-version.outputs.version }}
            ${{ steps.image.outputs.ghcr }}:latest
            ${{ steps.image.outputs.dockerhub }}:${{ steps.package-version.outputs.version }}
            ${{ steps.image.outputs.dockerhub }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip (already published)
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "::notice::Version ${{ steps.package-version.outputs.version }} is already published to GHCR and Docker Hub, skipping build."
